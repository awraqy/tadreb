/* Layout: sticky brand bar, centered 760px column, answer tiles in the four exam colors */
:root{
  --purple:#4a3b94; --orange:#f3a05a; --green:#4fb07b; --teal:#4fb4c8;
  --bg:#f5f3fb; --surface:#ffffff; --fg:#241f45; --muted:#6a6590; --line:#dcd8ee;
  --ok:#2f9a62; --bad:#d9534f; --ok-bg:#e3f5ea; --bad-bg:#fbe7e6; --accent:#4a3b94; --accent-fg:#fff;
  --display:'Sakkal Majalla','Tahoma',system-ui,sans-serif; --body:'Sakkal Majalla','Tahoma',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17142b; --surface:#221d40; --fg:#efecfb; --muted:#a7a2cc; --line:#3a3466;
  --ok:#5fd08e; --bad:#ff8480; --ok-bg:#1d3a2e; --bad-bg:#40222a; --accent:#8d7ef0; --accent-fg:#14102a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17142b; --surface:#221d40; --fg:#efecfb; --muted:#a7a2cc; --line:#3a3466;
  --ok:#5fd08e; --bad:#ff8480; --ok-bg:#1d3a2e; --bad-bg:#40222a; --accent:#8d7ef0; --accent-fg:#14102a; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{direction:rtl;text-align:right;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:20.8px;line-height:1.55;
  padding-block:0 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
.wrap{max-width:760px;margin-inline:auto}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px));
  border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--orange),var(--green),var(--teal),var(--purple)) 1}
.bar-in{max-width:760px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);cursor:pointer;background:none;border:0;padding:0;text-align:start}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:15.6px;color:var(--muted);line-height:1.2}
.timer{font-variant-numeric:tabular-nums;font-family:var(--display);font-weight:700;background:var(--bg);border-radius:999px;padding:4px 14px;color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.35;margin:0}
.hero{padding-block:28px 8px}
.hero h1{font-size:clamp(34px,7.15vw,49px);font-weight:700;color:var(--accent)}
.hero p{color:var(--muted);max-width:56ch;margin:8px 0 0}
.guide{display:block;width:100%;max-width:640px;border-radius:16px;border:1px solid var(--line);margin-top:6px}
.notice{margin-top:14px;font-size:16.9px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.step{margin-top:26px}
.step h2{font-size:23.4px;margin-bottom:10px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.chip{font:inherit;text-align:center;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:12px 10px;cursor:pointer;min-width:0}
.chip b{display:block;font-family:var(--display);font-size:20.8px;line-height:1.4}
.chip span{font-size:16.9px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.chip.s1[aria-pressed="true"]{border-color:var(--orange)}.chip.s2[aria-pressed="true"]{border-color:var(--green)}.chip.s3[aria-pressed="true"]{border-color:var(--teal)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font:inherit;font-size:18.2px;background:var(--surface);color:var(--fg);border:2px solid var(--line);border-radius:999px;padding:4px 14px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.btn{font:inherit;font-family:var(--display);font-weight:700;background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:12px 26px;cursor:pointer;font-size:22.1px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.start{margin-top:26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.best{font-size:18.2px;color:var(--muted)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;font-size:18.2px;color:var(--muted)}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--green),var(--teal));transition:width .3s}
.qcard{background:var(--surface);border-radius:20px;padding:22px 20px;margin-top:16px;border:1px solid var(--line)}
.tag{display:inline-block;font-size:15.6px;border-radius:999px;padding:0 10px;background:var(--bg);color:var(--accent);margin-inline-start:8px}
.qcard h2{font-size:clamp(25px,5.2vw,31px);font-weight:700;margin-top:6px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{font:inherit;text-align:start;display:flex;gap:12px;align-items:center;background:var(--bg);color:var(--fg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-width:0}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff}
.opt:nth-child(1) .k{background:var(--orange)}.opt:nth-child(2) .k{background:var(--teal)}.opt:nth-child(3) .k{background:var(--green)}.opt:nth-child(4) .k{background:var(--purple)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.dot{font:inherit;font-size:16.9px;width:32px;height:32px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums;padding:0}
.dot.done{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.dot.cur{outline:3px solid var(--orange);outline-offset:1px}
.dot.flag{border-color:var(--orange);box-shadow:inset 0 -4px 0 var(--orange)}
.flagbtn{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 0}
.flagbtn[aria-pressed="true"]{color:var(--orange);font-weight:700}
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;margin-top:22px}

function buildCopy(){
  const st=[...document.querySelectorAll('style')].find(s=>s.textContent.indexOf('--purple')>-1);
  const sc=[...document.querySelectorAll('script:not([src])')].find(s=>s.textContent.indexOf('const BANK=')>-1||s.textContent.indexOf('const BANK =')>-1);
  const hd=document.querySelector('header.bar'),ft=document.querySelector('footer');
  if(!st||!sc||!hd||!ft)return null;
  const js=sc.textContent.replace('const IS_COPY=false;','const IS_COPY=true;');
  return '<!doctype html>\n<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>تدريب أوراق</title>'
   +'<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style><style>'+st.textContent+'</style></head><body>'
   +hd.outerHTML+'<main class="wrap" id="app"></main>'+ft.outerHTML+'<script>'+js+'<\/script></body></html>';
}
async function getDl(){try{return window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){return null}}
async function saveCopy(){
  const msg=$('#dlmsg');msg.style.color='var(--ok)';msg.textContent='';
  const html=buildCopy();
  if(!html){msg.style.color='var(--bad)';msg.textContent='تعذّر تجهيز النسخة، حدّث الصفحة وحاول مرة أخرى.';return}
  let dl=await getDl(),pm=null,st='';
  try{pm=window.claude&&window.claude.use?await window.claude.use('permissions'):null}catch(e){pm=null}
  if(pm){
    try{
      st=await pm.state('downloads');
      if(st==='prompt'){await pm.request(['downloads']);st=await pm.state('downloads');if(!dl)dl=await getDl()}
    }catch(e){}
  }
  if(dl){
    try{await dl.save({filename:'awraq-training.html',data:new Blob([html],{type:'text/html'})});msg.textContent='تم تجهيز الملف. ستجده في مجلد التنزيلات، افتحه بأي متصفح.';return}
    catch(e){if(e&&e.code==='declined')return}
  }
  if(!dl&&window.top===window){
    try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='awraq-training.html';document.body.appendChild(a);a.click();a.remove();msg.textContent='بدأ التنزيل. ستجد الملف awraq-training.html في مجلد التنزيلات.';return}catch(e){}
  }
  msg.style.color='var(--fg)';
  const names={denied:'الإذن مرفوض لهذه الصفحة',unavailable:'غير متاح في هذا العرض',prompt:'لم يُمنح الإذن',granted:'مسموح لكن فشل الحفظ'};
  msg.innerHTML='تعذّر الحفظ المباشر هنا'+(st?' ('+(names[st]||st)+')':'')+'.<br>افتح رابط المنصة في متصفح الجهاز مباشرة (Chrome أو Safari أو Edge) ثم اضغط الزر مرة أخرى.'
   +(st==='denied'?'<br><button class="btn ghost" id="dlperm" type="button" style="margin-top:8px;font-size:17px;padding:6px 16px">فتح إعدادات الأذونات</button>':'')
   +'<div style="margin-top:12px;font-size:17px;color:var(--muted)">أو انسخ المحتوى والصقه في المفكرة واحفظه باسم <bdi dir="ltr">awraq-training.html</bdi>.<br><button class="btn ghost" id="dlcopy" type="button" style="margin-top:6px;font-size:17px;padding:6px 16px">انسخ محتوى الملف</button></div>';
  const pb=$('#dlperm');if(pb)pb.onclick=async()=>{try{await pm.manage();saveCopy()}catch(e){msg.insertAdjacentHTML('beforeend','<div>افتح قائمة الأذونات (Permissions) الخاصة بالمنصة وفعّل التنزيل.</div>')}};
  $('#dlcopy').onclick=async()=>{
    try{await navigator.clipboard.writeText(html);msg.insertAdjacentHTML('beforeend','<div style="color:var(--ok)">تم النسخ. الصقه الآن في ملف جديد.</div>')}
    catch(e){const ta=document.createElement('textarea');ta.readOnly=true;ta.value=html;ta.style.cssText='width:100%;height:120px;margin-top:8px;direction:ltr';msg.appendChild(ta);ta.focus();ta.select();msg.insertAdjacentHTML('beforeend','<div>حدّد الكل (Ctrl+A) وانسخه (Ctrl+C) ثم الصقه في ملف جديد.</div>')}
  };
}

function home(){
  clearTimeout(hs.t);clearInterval(S.tm);timerEl.hidden=true;
  app.innerHTML=`
  <section class="hero">
    <h1>تدرّب على أسئلة محاكية لنماذج نافس</h1>
    <p>أسئلة مصاغة للتدريب فقط، موزعة على مجالات كل مادة، بوقت محدد وتصحيح فوري وشرح لكل إجابة. اختر الصف والمادة والمجال وابدأ.</p>
    <div class="notice">منصة للتدريب على أسئلة محاكية لنماذج نافس، أسئلتها مصاغة للتدريب فقط وليست الاختبار الرسمي.</div>
  </section>
  ${IS_COPY?'':`<section class="dlbox" id="dlbox"><div class="tx"><h2>احفظ المنصة على جهازك</h2><p>تحصل على نسخة مستقلة تعمل بدون الرابط، ونتائجك فيها تبقى على جهازك وحده.</p></div><button class="btn" id="dlbtn" type="button">حمّل المنصة على جهازك</button><div id="dlmsg" role="status"></div></section>`}
  <section class="step"><h2>كيف تتدرب؟</h2><div class="how" id="how"></div></section>
  <section class="step"><h2>الصف</h2><div class="choices" id="lv"></div></section>
  <section class="step" id="stSub"><h2>المادة</h2><div class="choices" id="sb"></div></section>
  <section class="step" id="stDom"><h2>المجال</h2><div class="pills" id="dm"></div></section>
  <section class="step" id="stCnt"><h2>عدد الأسئلة</h2><div class="pills" id="ct"></div></section>
  <div class="start"><button class="btn" id="go">ابدأ التدريب</button><span class="best" id="best"></span></div>`;
  const lv=$('#lv'),sb=$('#sb'),dm=$('#dm'),ct=$('#ct'),go=$('#go');
  const paint=()=>{
    lv.innerHTML=Object.entries(BANK).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="${S.level===k}"><b>${v.name}</b><span>${fmt(Object.keys(v.subs).length)} ${Object.keys(v.subs).length===2?'مادتان':'مواد'}</span></button>`).join('');
    $('#stSub').hidden=!S.level;$('#stDom').hidden=!S.sub;$('#stCnt').hidden=!S.sub;
    if(S.level)sb.innerHTML=Object.entries(BANK[S.level].subs).map(([k,v],n)=>`<button class="chip s${n+1}" data-k="${k}" aria-pressed="${S.sub===k}"><b>${v.name}</b><span>${fmt(v.q.length)} سؤالًا</span></button>`).join('');
    if(S.sub){
      const d=domains();
      dm.innerHTML=`<button class="pill" data-k="all" aria-pressed="${S.dom==='all'}">كل المجالات (${fmt(BANK[S.level].subs[S.sub].q.length)})</button>`+Object.entries(d).map(([k,c])=>`<button class="pill" data-k="${k}" aria-pressed="${S.dom===k}">${k} (${fmt(c)})</button>`).join('');
      const tot=pool().length,opts=[...new Set([10,20,30,tot].filter(x=>x<=tot))];
      if(!opts.includes(S.cnt))S.cnt=opts[0];
      ct.innerHTML=opts.map(x=>`<button class="pill" data-k="${x}" aria-pressed="${S.cnt===x}">${x===tot?'كل الأسئلة ('+fmt(x)+')':fmt(x)+' أسئلة'}</button>`).join('');
    }
    go.disabled=!(S.level&&S.sub);
    const b=S.level&&S.sub?store.get('best-'+S.level+S.sub):null;
    $('#best').textContent=b!=null?'أفضل نتيجة لك في هذه المادة: '+fmt(b)+'٪':'';
  };
  lv.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;S.level=c.dataset.k;S.sub=null;S.dom='all';paint()};
  sb.onclick=e=>{const c=e.target.closest('.chip');if(!c)return;S.sub=c.dataset.k;S.dom='all';paint()};
  dm.onclick=e=>{const c=e.target.closest('.pill');if(!c)return;S.dom=c.dataset.k;paint()};
  ct.onclick=e=>{const c=e.target.closest('.pill');if(!c)return;S.cnt=+c.dataset.k;paint()};
  go.onclick=start;
  paint();
  hs.i=0;hs.play=true;howRun();
  if(!IS_COPY)dlInit();
}

function pickQuestions(){
  const p=pool();
  if(S.dom!=='all')return shuffle(p).slice(0,S.cnt);
  const g={};shuffle(p).forEach(x=>(g[x.d]=g[x.d]||[]).push(x));
  const lists=shuffle(Object.values(g)),out=[];
  while(out.length<Math.min(S.cnt,p.length)){let any=false;for(const l of lists){if(l.length&&out.length<S.cnt){out.push(l.shift());any=true}}if(!any)break}
  return shuffle(out);
}

function start(){
  clearTimeout(hs.t);
  S.qs=pickQuestions().map(q=>{const idx=shuffle([0,1,2,3]);return {d:q.d,q:q.q,o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),e:q.e}});
  S.ans=S.qs.map(()=>null);S.flag=S.qs.map(()=>false);S.i=0;S.warned=false;S.left=S.qs.length*TIME_PER_Q;
  timerEl.hidden=false;tick();clearInterval(S.tm);
  S.tm=setInterval(()=>{S.left--;tick();if(S.left<=0)finish()},1000);
  quiz();scrollTo(0,0);
}
function tick(){const m=Math.floor(S.left/60),s=S.left%60;timerEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}

function quiz(){
  const q=S.qs[S.i],n=S.qs.length,last=S.i===n-1;
  app.innerHTML=`
  <div class="qhead"><span>${BANK[S.level].name} · ${BANK[S.level].subs[S.sub].name}</span><span>السؤال ${fmt(S.i+1)} من ${fmt(n)}</span></div>
  <div class="track"><i style="width:${(S.i+1)/n*100}%"></i></div>
  <div class="qcard">
    <div><button class="flagbtn" id="fl" aria-pressed="${S.flag[S.i]}">${S.flag[S.i]?'تمت العلامة للمراجعة':'علّم للمراجعة'}</button><span class="tag">${q.d}</span></div>
    <h2>${q.q}</h2>
    <div class="opts">${q.o.map((t,k)=>`<button class="opt" data-k="${k}" aria-pressed="${S.ans[S.i]===k}"><span class="k">${KEY_LABELS[k]}</span><span>${t}</span></button>`).join('')}</div>
  </div>
  <div class="nav">
    <button class="btn ghost" id="prev" ${S.i===0?'disabled':''}>السابق</button>
    ${last?'<button class="btn" id="fin">إنهاء الاختبار</button>':'<button class="btn" id="next">التالي</button>'}
  </div>
  <div class="dots">${S.qs.map((_,k)=>`<button class="dot ${S.ans[k]!==null?'done':''} ${k===S.i?'cur':''} ${S.flag[k]?'flag':''}" data-k="${k}" aria-label="السؤال ${k+1}">${fmt(k+1)}</button>`).join('')}</div>`;
  app.querySelector('.opts').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;S.ans[S.i]=+b.dataset.k;quiz()};
  $('#fl').onclick=()=>{S.flag[S.i]=!S.flag[S.i];quiz()};
  $('#prev').onclick=()=>{S.i--;quiz()};
  if(last)$('#fin').onclick=()=>{
    const un=S.ans.filter(a=>a===null).length;
    if(un&&!S.warned){S.warned=true;$('#fin').textContent='لديك '+fmt(un)+' أسئلة بلا إجابة، اضغط مرة أخرى للإنهاء';return}
    finish()};
  else $('#next').onclick=()=>{S.i++;quiz()};
  app.querySelector('.dots').onclick=e=>{const d=e.target.closest('.dot');if(!d)return;S.i=+d.dataset.k;quiz()};
}

function finish(){
  clearInterval(S.tm);timerEl.hidden=true;
  const n=S.qs.length,ok=S.qs.filter((q,i)=>S.ans[i]===q.a).length,skip=S.ans.filter(a=>a===null).length,pct=Math.round(ok/n*100);
  if(S.dom==='all'&&S.cnt>=Math.min(n,BANK[S.level].subs[S.sub].q.length)){const bk='best-'+S.level+S.sub;if((store.get(bk)||0)<pct)store.set(bk,pct)}
  const by={};S.qs.forEach((q,i)=>{const o=by[q.d]=by[q.d]||{t:0,c:0};o.t++;if(S.ans[i]===q.a)o.c++});
  const msg=pct>=85?'أداء ممتاز، واصل بهذا المستوى.':pct>=60?'أداء جيد، راجع الأسئلة الخاطئة وأعد المحاولة.':'تحتاج إلى مزيد من التدريب، ابدأ بمراجعة الشرح أدناه.';
  app.innerHTML=`
  <section class="score">
    <div class="ring" style="--p:${pct}"><div>${fmt(pct)}٪</div></div>
    <div><h1 style="font-size:31px">${msg}</h1>
      <div class="stats"><span class="stat">صحيحة: ${fmt(ok)}</span><span class="stat">خاطئة: ${fmt(n-ok-skip)}</span><span class="stat">بلا إجابة: ${fmt(skip)}</span></div></div>
  </section>
  <section class="step"><h2>نتيجتك في كل مجال</h2><div class="bd">${Object.entries(by).map(([d,o])=>{const p=Math.round(o.c/o.t*100);return `<div class="bd-row"><span>${d}</span><div class="bd-bar"><i class="${p<60?'low':''}" style="width:${p}%"></i></div><b>${fmt(o.c)} / ${fmt(o.t)}</b></div>`}).join('')}</div></section>
  <div class="start"><button class="btn" id="again">أعد المحاولة</button><button class="btn ghost" id="menu">اختر مادة أخرى</button></div>
  <section class="step"><h2>مراجعة الإجابات</h2>
  ${S.qs.map((q,i)=>{const good=S.ans[i]===q.a;return `<article class="rev ${good?'ok':'no'}"><h3>${fmt(i+1)}. ${q.q}</h3>
    <p>إجابتك: <b>${S.ans[i]===null?'لم تُجب':q.o[S.ans[i]]}</b>${good?'':` · الصحيحة: <b>${q.o[q.a]}</b>`}</p><p class="exp">${q.e}</p><span class="tag" style="margin:6px 0 0">${q.d}</span></article>`}).join('')}</section>`;
  $('#again').onclick=start;$('#menu').onclick=home;scrollTo(0,0);
}
$('#home').onclick=home;
home();
</script></body></html>
